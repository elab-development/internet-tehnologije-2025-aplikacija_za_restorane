version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: restoran_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: restoran_app
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  app:
    build: .
    container_name: restoran_app
    restart: always
    depends_on:
      - db
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: mysql://root:root@db:3306/restoran_app
      JWT_SECRET: supersecretkey
      NODE_ENV: production

volumes:
  mysql_data: